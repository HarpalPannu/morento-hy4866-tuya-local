name: MORENTO Air Purifier
products:
  - id: wqymg6ujqvmixp2i
    manufacturer: MORENTO
    model: HY4866-WF
entities:
  - entity: fan
    translation_key: air_purifier
    dps:
      - id: 1
        type: boolean
        name: switch
      - id: 3
        type: string
        name: preset_mode
        optional: true
        mapping:
          - dps_val: auto
            value: auto
          - dps_val: sleep
            value: sleep
          - dps_val: manual
            value: manual
      - id: 4
        type: string
        name: speed
        mapping:
          - dps_val: 1F
            value: 25
          - dps_val: 2F
            value: 50
          - dps_val: 3F
            value: 75
          - dps_val: 4F
            value: 100
  - entity: sensor
    class: pm25
    dps:
      - id: 2
        type: integer
        optional: true
        name: sensor
        class: measurement
        unit: ugm3
  - entity: sensor
    translation_key: filter_life
    category: diagnostic
    dps:
      - id: 5
        type: integer
        optional: true
        name: sensor
        unit: "%"
  - entity: select
    translation_key: timer
    category: config
    dps:
      - id: 18
        type: string
        optional: true
        name: option
        mapping:
          - dps_val: cancel
            value: cancel
          - dps_val: 2h
            value: 2h
          - dps_val: 5h
            value: 5h
          - dps_val: 8h
            value: 8h
  - entity: lock
    translation_key: child_lock
    category: config
    dps:
      - id: 7
        type: boolean
        name: lock
  - entity: button
    translation_key: filter_reset
    category: config
    dps:
      - id: 11
        type: boolean
        optional: true
        name: button
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 22
        type: bitfield
        optional: true
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - dps_val: null
            value: false
          - value: true
      - id: 22
        type: bitfield
        optional: true
        name: fault_code
